<!DOCTYPE html>
<html lang="es-CL">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kuyen Climbing | Templates candidatos</title>
  <meta name="description" content="Los cuatro templates candidatos para el sitio de Kuyen Climbing, servidos tal cual, con un selector para pasar de uno al siguiente.">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://kuyenclimbing.cl/">
  <meta name="theme-color" content="#0a0e1d">

  <link rel="icon" type="image/svg+xml" href="/img/marca-luna.svg">
  <link rel="apple-touch-icon" href="/img/marca-luna.svg">

  <meta property="og:title" content="Kuyen Climbing | Templates candidatos">
  <meta property="og:description" content="Los cuatro templates candidatos para el sitio de Kuyen Climbing, servidos tal cual, con un selector para pasar de uno al siguiente.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://kuyenclimbing.cl/">
  <meta property="og:locale" content="es_CL">
  <meta property="og:site_name" content="Kuyen Climbing">
</head>
<body>

  <h1 class="kt-solo-lectores">Kuyen Climbing: templates candidatos</h1>

  <!-- Cada template se sirve entero, tal como está, dentro de su propio
       documento. El marco solo lo muestra a pantalla completa y le cambia la
       fuente cuando el toggle pasa al siguiente: así el template no comparte
       estilos ni scripts con nada y se ve exactamente como el original. -->
  <iframe id="kt-marco" title="Template Hive" src="/t/hive"></iframe>

  <!-- ThemeToggle: copia del de Pagos Pendientes y Tipo de Cambio
       (src/components/theme-toggle.tsx en los dos repos), en su tamaño sm y en
       la misma posición que usan en su Login: arriba a la derecha
       (absolute top-4 right-4 z-10). Mismas clases traducidas a CSS, mismos
       colores del tema oscuro, que es el que usan por defecto.

       Dos diferencias, las dos por el contenido: tiene cuatro posiciones en vez
       de tres, y en vez de poner una clase en <html> cambia la fuente del
       marco, porque cada template vive en su propio documento. -->
  <div class="kt-esquina">
    <button type="button" class="kt-toggle" aria-label="Cambiar de template" title="Template Hive" data-tema-boton>
      <span class="kt-knob" data-tema-knob><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 21.73a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73z"/></svg></span>
    </button>
  </div>

<style>
  html, body { height: 100%; margin: 0; background: #0a0a0a; }
  .kt-solo-lectores {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }
  #kt-marco { display: block; width: 100%; height: 100%; border: 0; }

  /* absolute top-4 right-4 z-10 */
  .kt-esquina { position: absolute; top: 1rem; right: 1rem; z-index: 10; }

  /* relative inline-flex items-center rounded-full transition-colors duration-200
     h-7 w-[4.5rem] bg-muted-foreground/40, con los tokens del tema dark de PP
     (--muted-foreground: 0 0% 63.9%). El ancho suma un paso de 1.375rem al de
     PP para la cuarta posición: 4.5rem + 1.375rem = 5.875rem. */
  .kt-toggle {
    position: relative;
    display: inline-flex;
    align-items: center;
    height: 1.75rem;
    width: 5.875rem;
    padding: 0;
    border: 0;
    border-radius: 9999px;
    background-color: hsl(0 0% 63.9% / 0.4);
    cursor: pointer;
    transition: color, background-color, border-color, fill, stroke;
    transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
    transition-duration: 200ms;
  }
  /* focus:outline-none focus:ring-2 focus:ring-ring focus:ring-offset-2
     focus:ring-offset-background (--ring: 25 95% 53%, --background: 0 0% 3.9%) */
  .kt-toggle:focus {
    outline: 2px solid transparent;
    outline-offset: 2px;
    box-shadow: 0 0 0 2px hsl(0 0% 3.9%), 0 0 0 4px hsl(25 95% 53%);
  }

  /* inline-flex items-center justify-center rounded-full bg-white shadow-sm
     transform transition-transform duration-200 h-5 w-5 translate-x-1 */
  .kt-knob {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    height: 1.25rem;
    width: 1.25rem;
    border-radius: 9999px;
    background-color: #fff;
    box-shadow: 0 1px 2px 0 rgb(0 0 0 / 0.05);
    transform: translateX(0.25rem);
    transition: transform 200ms cubic-bezier(0.4, 0, 0.2, 1);
  }
  /* h-3 w-3 del icono */
  .kt-knob svg { height: 0.75rem; width: 0.75rem; }
</style>

<script>
  (function () {
    'use strict'

    var TEMAS = [{"id":"hive","nombre":"Hive","icono":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M11 21.73a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73z\"/></svg>","ruta":"/t/hive"},{"id":"karate","nombre":"Karate","icono":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z\"/></svg>","ruta":"/t/karate"},{"id":"hirael","nombre":"Hirael","icono":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z\"/></svg>","ruta":"/t/hirael"},{"id":"nex","nombre":"NexStudio","icono":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83Z\"/><path d=\"m6.08 9.5-3.5 1.6a1 1 0 0 0 0 1.81l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9a1 1 0 0 0 0-1.83l-3.5-1.59\"/><path d=\"m6.08 14.5-3.5 1.6a1 1 0 0 0 0 1.81l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9a1 1 0 0 0 0-1.83l-3.5-1.59\"/></svg>","ruta":"/t/nex"}]
    var CLAVE = 'kuyen-tema'

    // POSITIONS del toggle sm de PP: translate-x-1, translate-x-[1.625rem],
    // translate-x-[3rem]. Pasos de 1.375rem; la cuarta posición sigue el mismo
    // paso.
    var POSICIONES = TEMAS.map(function (_, i) { return 0.25 + 1.375 * i })

    // iconClass de PP: la primera opción (dark) en text-muted-foreground y las
    // demás en text-primary, con los tokens del tema dark.
    var COLOR_PRIMERA = 'hsl(0 0% 63.9%)'
    var COLOR_RESTO = 'hsl(25 95% 53%)'

    var marco = document.getElementById('kt-marco')
    var boton = document.querySelector('[data-tema-boton]')
    var knob = document.querySelector('[data-tema-knob]')
    if (!marco || !boton || !knob) return

    var indice = 0
    try {
      var guardado = localStorage.getItem(CLAVE)
      for (var i = 0; i < TEMAS.length; i++) if (TEMAS[i].id === guardado) indice = i
    } catch (e) {}

    function aplicar(i, cargar) {
      var tema = TEMAS[i]
      var siguiente = TEMAS[(i + 1) % TEMAS.length]

      if (cargar) marco.src = tema.ruta
      marco.title = 'Template ' + tema.nombre

      knob.style.transform = 'translateX(' + POSICIONES[i] + 'rem)'
      knob.style.color = i === 0 ? COLOR_PRIMERA : COLOR_RESTO
      knob.innerHTML = tema.icono

      // Como en PP: title con la opción activa, aria-label con la siguiente.
      boton.setAttribute('title', 'Template ' + tema.nombre)
      boton.setAttribute('aria-label', 'Cambiar a Template ' + siguiente.nombre)

      try { localStorage.setItem(CLAVE, tema.id) } catch (e) {}
    }

    // El primer render ya trae el template por defecto en el src; solo se
    // recarga el marco si lo guardado es otro.
    aplicar(indice, indice !== 0)

    // Ciclo: Hive -> Karate -> Hirael -> NexStudio -> Hive
    boton.addEventListener('click', function () {
      indice = (indice + 1) % TEMAS.length
      aplicar(indice, true)
    })
  })()
</script>

</body>
</html>
