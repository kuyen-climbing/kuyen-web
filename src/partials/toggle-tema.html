<!-- ToggleTheme: el mismo patrón que el de Pagos Pendientes
     (APP-PAGOS-PENDIENTES-frontend/src/components/theme-toggle.tsx): una
     píldora con el pulsador en la posición del tema activo, un icono por tema,
     ciclo al siguiente en cada clic y la elección guardada.

     Cambia el tema de esta misma página: pone la clase en <html> y las
     variables CSS hacen el resto. No navega a ningún lado. Los cuatro temas
     están definidos en src/css/tailwind.css. -->
<div class="flex items-center gap-2" data-tema-toggle>
  <button
    type="button"
    class="relative inline-flex h-9 w-[7rem] items-center rounded-full bg-suave-texto/30 transition-colors duration-200 hover:bg-suave-texto/40 focus:outline-none focus-visible:ring-2 focus-visible:ring-primario focus-visible:ring-offset-2 focus-visible:ring-offset-fondo"
    aria-label="Cambiar de tema"
    title="Tema"
    data-tema-boton
  >
    <span
      class="inline-flex h-7 w-7 translate-x-1 items-center justify-center rounded-full bg-fondo text-texto shadow-sm transition-transform duration-200 [&_svg]:h-4 [&_svg]:w-4"
      data-tema-knob
    >{{temaIconoInicial}}</span>
  </button>
  <p class="hidden text-xs font-semibold leading-none text-suave-texto sm:block">
    <span data-tema-etiqueta>{{temaNombreInicial}}</span>
  </p>
</div>

<script>
  (function () {
    'use strict'

    var TEMAS = {{temasJson}}
    var CLAVE = 'kuyen-tema'
    var raiz = document.documentElement

    var contenedor = document.querySelector('[data-tema-toggle]')
    if (!contenedor) return
    var boton = contenedor.querySelector('[data-tema-boton]')
    var knob = contenedor.querySelector('[data-tema-knob]')
    var etiqueta = contenedor.querySelector('[data-tema-etiqueta]')

    function guardado() {
      try {
        var v = localStorage.getItem(CLAVE)
        for (var i = 0; i < TEMAS.length; i++) if (TEMAS[i].id === v) return i
      } catch (e) {}
      return 0
    }

    // Posiciones del pulsador: el ancho útil de la píldora repartido entre los
    // temas, como las translate-x fijas del toggle de Pagos Pendientes.
    var ANCHO = 7 // rem, el mismo valor que la clase w-[7rem] del botón
    var LIBRE = ANCHO - 1.75 - 0.5 // menos el pulsador y los márgenes
    var PASO = TEMAS.length > 1 ? LIBRE / (TEMAS.length - 1) : 0

    var indice = guardado()

    function aplicar(i, guardar) {
      var tema = TEMAS[i]
      var siguiente = TEMAS[(i + 1) % TEMAS.length]

      for (var j = 0; j < TEMAS.length; j++) raiz.classList.remove('tema-' + TEMAS[j].id)
      raiz.classList.add('tema-' + tema.id)

      knob.style.transform = 'translateX(' + (0.25 + PASO * i) + 'rem)'
      knob.innerHTML = tema.icono
      if (etiqueta) etiqueta.textContent = tema.nombre
      boton.setAttribute('title', 'Tema ' + tema.nombre)
      boton.setAttribute('aria-label', 'Cambiar al tema ' + siguiente.nombre)

      if (guardar) {
        try { localStorage.setItem(CLAVE, tema.id) } catch (e) {}
      }
    }

    aplicar(indice, false)

    boton.addEventListener('click', function () {
      indice = (indice + 1) % TEMAS.length
      aplicar(indice, true)
    })
  })()
</script>
