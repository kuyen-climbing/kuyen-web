<!DOCTYPE html>
<html lang="{{lang}}" class="h-full scroll-smooth bg-noche-950 antialiased">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{title}}</title>
  <meta name="description" content="{{description}}">
  <meta name="author" content="Kuyen Climbing">
  <meta name="robots" content="{{robots}}">
  <link rel="canonical" href="{{canonical}}">
  <meta name="theme-color" content="#0a0e1d">

  <!-- Isotipo placeholder (luna creciente propia). PENDIENTE: reemplazar por
       el isotipo real de Kuyen cuando entreguen los archivos de marca. -->
  <link rel="icon" type="image/svg+xml" href="/img/marca-luna.svg">
  <link rel="apple-touch-icon" href="/img/marca-luna.svg">

  <!-- Open Graph. PENDIENTE: falta og:image (1200x630) con una foto real del muro. -->
  <meta property="og:title" content="{{title}}">
  <meta property="og:description" content="{{description}}">
  <meta property="og:type" content="website">
  <meta property="og:url" content="{{canonical}}">
  <meta property="og:locale" content="{{locale}}">
  <meta property="og:site_name" content="Kuyen Climbing">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="{{title}}">
  <meta name="twitter:description" content="{{description}}">

  <!-- Datos estructurados -->
{{jsonld}}
  <!-- Tipografia: Inter para texto y Lexend para titulos (font-display),
       autoalojadas en /fonts (licencia OFL, sin peticiones a terceros). -->
  <link rel="stylesheet" href="/css/styles.css?v={{cssv}}">
  <script src="/js/main.js?v={{jsv}}" defer></script>
</head>
<body class="flex h-full flex-col bg-noche-950 font-sans text-noche-100">
  <a href="#contenido" class="sr-only focus:not-sr-only focus:absolute focus:left-4 focus:top-4 focus:z-50 focus:rounded-lg focus:bg-presa-500 focus:px-4 focus:py-2 focus:font-semibold focus:text-noche-950">Saltar al contenido</a>
