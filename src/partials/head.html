<!DOCTYPE html>
<html lang="{{lang}}" class="h-full scroll-smooth antialiased tema-{{temaPorDefecto}}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{title}}</title>
  <meta name="description" content="{{description}}">
  <meta name="author" content="Kuyen Climbing">
  <meta name="robots" content="{{robots}}">
  <link rel="canonical" href="{{canonical}}">

  <!-- El tema guardado se aplica antes de pintar, para que la página no
       aparezca un instante con el tema por defecto y salte al elegido.
       Mismo rol que el script que inyecta next-themes en Pagos Pendientes. -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('kuyen-tema')
        var validos = {{temasIds}}
        if (t && validos.indexOf(t) !== -1) {
          var r = document.documentElement
          for (var i = 0; i < validos.length; i++) r.classList.remove('tema-' + validos[i])
          r.classList.add('tema-' + t)
        }
      } catch (e) {}
    })()
  </script>

  <!-- Isotipo placeholder (luna creciente propia). PENDIENTE: reemplazar por
       el isotipo real de Kuyen cuando entreguen los archivos de marca. -->
  <link rel="icon" type="image/svg+xml" href="/img/marca-luna.svg">
  <link rel="apple-touch-icon" href="/img/marca-luna.svg">

  <!-- Open Graph. PENDIENTE: falta og:image (1200x630) con una foto real del muro. -->
  <meta property="og:title" content="{{title}}">
  <meta property="og:description" content="{{description}}">
  <meta property="og:type" content="website">
  <meta property="og:url" content="{{canonical}}">
  <meta property="og:locale" content="{{locale}}">
  <meta property="og:site_name" content="Kuyen Climbing">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="{{title}}">
  <meta name="twitter:description" content="{{description}}">

  <!-- Datos estructurados -->
{{jsonld}}
  <link rel="stylesheet" href="/css/styles.css?v={{cssv}}">
  <script src="/js/main.js?v={{jsv}}" defer></script>
</head>
<body class="flex h-full flex-col bg-fondo text-texto">
  <a href="#contenido" class="sr-only focus:not-sr-only focus:absolute focus:left-4 focus:top-4 focus:z-50 focus:rounded-tema focus:bg-primario focus:px-4 focus:py-2 focus:font-semibold focus:text-primario-texto">Saltar al contenido</a>
